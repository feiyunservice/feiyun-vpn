<!DOCTYPE html>

<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<link rel="stylesheet" href="assets/pricing.css">
</head>
<body>

<nav>
  <div class="wrap">
    <a href="index.html" class="logo">
      <span class="logo-icon">
        <img src="assets/logo.svg" alt="飞云" width="28" height="28">
      </span>
      飞云

    <div class="navlinks">
      <a href="index.html#features">功能</a>
      <a href="pricing.html">套餐</a>
      <a href="tutorial.html">使用方法</a>
      <a href="tutorial.html#faq">常见问题</a>
    </div>
    <div class="nav-right">
      <a href="#" id="myOrdersBtn" class="nav-cta" style="background:transparent;color:var(--text);border:1px solid var(--line);">已购订单</a>
      <a class="nav-github" href="https://github.com/feiyunservice/feiyun-vpn" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="展开导航">☰</button>
    </div>
  </div>
</nav>

<section id="pricing">
  <div class="wrap">
    <div class="section-head">
      <div class="section-eyebrow">Pricing</div>
      <h2>套餐选择</h2>
      <p class="section-desc">购买套餐激活码在客户端激活使用。</p>
    </div>
    <div class="price-grid" id="priceGrid">
      <div class="loading"><span class="spinner"></span> 加载套餐中...</div>
    </div>
  </div>
</section>

<!-- Purchase Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <button class="modal-close" id="modalClose">&times;</button>

    <!-- Step 1: Select payment method -->
    <div class="modal-step active" id="step-pay">
      <h3>确认购买</h3>
      <div class="modal-info" id="modalInfo"></div>
      <div class="pay-methods" id="payMethods">
        <div class="loading"><span class="spinner"></span> 加载支付方式...</div>
      </div>
      <div id="cfWidget" style="margin-bottom:20px;display:flex;justify-content:center;"></div>
      <button class="modal-btn" id="payBtn" disabled>选择支付方式后继续</button>
    </div>

    <!-- Step 2: Payment result -->
    <div class="modal-step" id="step-result">
      <div class="result-box" id="resultBox"></div>
    </div>
  </div>
</div>

<!-- My Orders Modal -->
<div class="modal-overlay" id="ordersModal">
  <div class="modal">
    <button class="modal-close" id="ordersModalClose">&times;</button>
    <h3>我的已购订单</h3>
    <p style="font-size:13px;color:var(--text-dim);margin-bottom:20px;">同一浏览器下所有已支付的订单。换浏览器或清缓存后，订单会丢失。</p>
    <div id="ordersContent" class="orders-content">
      <div class="loading"><span class="spinner"></span> 加载中...</div>
    </div>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="footer-meta">© 2026 飞云 · 让连接更自由</div>
    <div class="footer-links">
      <a href="tutorial.html#faq">常见问题</a>
      <a href="pricing.html">套餐</a>
      <a href="tutorial.html">使用方法</a>
    </div>
  </div>
</footer>

<script src="assets/nav.js"></script>
<script src="assets/pricing.js"></script>
<script src="assets/libredesk.js"></script>
</body>
</html>
